---
user: mj

dns_server: 192.168.1.40

apt_repositories:
  - name: docker
    uris: "https://download.docker.com/linux/{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    signed_by: "https://download.docker.com/linux/{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}/gpg"
# Files created by the old apt_repository task; removed so they don't conflict with the deb822 sources
apt_legacy_sources:
  - download_docker_com_linux_debian.list
  - download_docker_com_linux_ubuntu.list

packages:
  - vim
  - curl
  - git
  - wget
  - htop
  - lsd
  - bat
  - cron
  - jq
  - bluez
  - apt-transport-https
  - ca-certificates
  - bash-completion
  - python3-dev
  - python3-setuptools
  - python3-pip
  - nfs-common
  - lm-sensors
  - network-manager
  - glances
  - cockpit
  - cockpit-networkmanager
  - cockpit-packagekit
  - cockpit-podman
  - cockpit-storaged
  - cockpit-system
  - cockpit-ws

services:
  - cockpit.socket
  - glances

registry_hostname: docker.pve.home.lab
